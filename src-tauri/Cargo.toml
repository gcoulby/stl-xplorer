[package]
name = "stl-xplorer"
version = "0.2.1"
description = "Browse, preview and launch 3D printing models"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["Graham Coulby"]
resolver = "3"

[lib]
name = "stl_xplorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
# Read-only use: no AES (encrypted zips just get a lock badge) and no zopfli (compression only).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz", "zstd"] }
walkdir = "2"
notify = "8"
thiserror = "2"
trash = "5"
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
