# Pushing a version tag builds signed installers for Windows x64 and Apple Silicon macOS and
# publishes them with latest.json for the in-app updater:
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# The release stays a draft until every platform has uploaded its files, so the updater never
# sees a half-finished release. Both installers bundle 7-Zip so 7z and rar archives work
# without a separate install.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  draft:
    name: Check versions and draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      # The updater compares against the version baked into the app, so a tag that disagrees
      # with the version files would ship an app that keeps offering itself as an update.
      - name: Tag matches the version in every file
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          pkg=$(jq -r .version package.json)
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag=$want package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          [ "$pkg" = "$want" ] && [ "$conf" = "$want" ] && [ "$cargo" = "$want" ] \
            || { echo "::error::Version files do not match tag $TAG"; exit 1; }

      - name: Create draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # A draft is not attached to its tag yet, so looking it up by tag finds nothing.
        # Take the id from the create call instead.
        run: |
          id=$(gh api -X POST "repos/${{ github.repository }}/releases" \
            -f tag_name="$TAG" -f name="STL Xplorer $TAG" \
            -F body=@.github/release-notes.md -F draft=true --jq .id)
          test -n "$id" || { echo "Could not create the draft release"; exit 1; }
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # NSIS only: WiX's candle.exe (needed for .msi) does not run on the current runner image.
            bundles: nsis
            sevenzip_config: --config src-tauri/tauri.7zip.conf.json --config src-tauri/tauri.7zip.windows.conf.json
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            sevenzip_config: --config src-tauri/tauri.7zip.conf.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # One step per check: PowerShell does not stop on a failing command mid-script.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: cargo test --locked
        working-directory: src-tauri

      # Windows runners have 7-Zip preinstalled; setup:7zip copies 7z.exe and 7z.dll from it.
      - name: Bundle 7-Zip (Windows)
        if: runner.os == 'Windows'
        run: pnpm setup:7zip

      # macOS runners have no 7zz, so fetch the official standalone build (a universal binary
      # that only links system libraries). Pinned by checksum so a changed download fails loudly.
      - name: Bundle 7-Zip (macOS)
        if: runner.os == 'macOS'
        env:
          SEVENZIP_URL: https://www.7-zip.org/a/7z2600-mac.tar.xz
          SEVENZIP_SHA256: 8a2ea734b52b2cb7d568f5f13e0a137bea3004b221bdbee53197728a9051c849
        run: |
          dir="$RUNNER_TEMP/7zip"
          mkdir -p "$dir"
          curl -fsSL "$SEVENZIP_URL" -o "$dir/7z.tar.xz"
          echo "$SEVENZIP_SHA256  $dir/7z.tar.xz" | shasum -a 256 -c -
          tar -xf "$dir/7z.tar.xz" -C "$dir"
          pnpm setup:7zip "$dir/7zz"

      # Pasting a secret into GitHub often keeps a trailing newline, which the key decoder rejects.
      # Both values are single tokens (base64 and hex), so stripping all whitespace is safe.
      - name: Load signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          key=$(printf %s "$KEY" | tr -d '[:space:]')
          password=$(printf %s "$PASSWORD" | tr -d '[:space:]')
          if [ -z "$key" ]; then echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set"; exit 1; fi
          echo "::add-mask::$key"
          echo "::add-mask::$password"
          echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password" >> "$GITHUB_ENV"

      # tauri.release.conf.json turns on signed updater artifacts. Each job adds its platform
      # to latest.json on the draft release.
      - name: Build, sign and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} ${{ matrix.sevenzip_config }} --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}

  publish:
    name: Publish release
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check every platform uploaded its files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        # Never publish a release the updater cannot use.
        run: |
          names=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" --jq '.[].name')
          echo "$names"
          for pattern in '^latest\.json$' '\.app\.tar\.gz\.sig$' '\.dmg$' '-setup\.exe\.sig$'; do
            echo "$names" | grep -Eq -- "$pattern" || { echo "Missing asset matching $pattern"; exit 1; }
          done

      - name: Mark as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true --jq .html_url
