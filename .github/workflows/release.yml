# Builds the Windows installer and publishes a GitHub release when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The installer bundles 7-Zip (preinstalled on GitHub's Windows runners) so 7z and rar
# archives work without a separate install.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # One step per check: PowerShell does not stop on a failing command mid-script.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: cargo test --locked
        working-directory: src-tauri

      - name: Bundle 7-Zip
        run: pnpm setup:7zip

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # NSIS only: WiX's candle.exe (needed for .msi) does not run on the current runner image.
          args: --config src-tauri/tauri.7zip.conf.json --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: STL Xplorer ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          releaseBody: |
            Browse, preview and send 3D printing models to your slicer straight out of zip, 7z and rar packs, split ones included, without unpacking anything by hand.

            ## Install (Windows)

            Download **`STL.Xplorer_*_x64-setup.exe`** below and run it. 7-Zip is included, so 7z and rar archives work straight away.

            The installer is not code-signed yet, so Windows SmartScreen may warn about an unrecognised app. Choose **More info → Run anyway**.

            ## What's in it

            - **Archives as folders.** Browse zip, 7z and rar, including split sets (`.part1.rar`, `.7z.001`, `.z01` and others). Missing parts are flagged rather than hidden.
            - **Instant previews.** An STL viewer with a Z-up build plate and size readout, plus images and PDF guides from inside packs.
            - **Open in slicer.** Send one or many files to Bambu Studio, OrcaSlicer, PrusaSlicer or any slicer you add. Archive entries are extracted to a temporary cache first.
            - **Search, filters and sorting.** Search as you type, filter by type or tag, sort by name, size, date or type, and pick which columns show.
            - **Tags.** Tag by hand, with keyword rules, or automatically from words common to your folder names.
            - **Collections, packs and orientation.** Saved rotations per model, per pack or as a global default.
            - **Tidying up.** Find and delete unpacked copies of archives, zip folders (each zip is checked before its folder goes), and delete to the Recycle Bin.
            - **Vault.** Move files out of an auto-cleaning downloads folder into a protected one.

            macOS builds are not published yet because they have not been tested.

            Built with substantial AI assistance (Claude, via Claude Code). See the README for details.
